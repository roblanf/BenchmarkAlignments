study:
    reference: [reference taken from Google Scholar, in the VANCOUVER style when you find the paper and press 'cite']
    year: [year of publication, as an integer]
    DOI: [URL for the paper starting doi.org, check and double check that this points to the right study]

dataset:
    DOI: [must be a URL for the dataset, starting doi.org, which is different from 'study' DOI, check and double check that this points to the right dataset]
    license: [should always == "CC0" or "CCBY", usually Dryad datasets are CC0, and FigShare are CCBY, but you have to know for sure]
    figshare: [valid URL to figshare version of the dataset in our repository, or 'NA' until it has been uploaded]
    dataset curation:
        alignment file: [A file path in unix format. which alignment file do I use from the repo linked in the doi. give a file path e.g. alignments/nt-mt.phy]
        partition information: [A file path or notes about where the partition information is, or how it was obtained. E.g. "alignments/nt-mt-gene-partitioning.txt, each partition was assumed to be in frame 1; this was checked by translation"]
        justification: [Why use this alignment file? E.g. "This is the alignment used to produce figure x in the paper"]
        sequence edits: ['NA', or describe any changes made to the alignment, e.g. "removed taxon Test123 because it was not in the tree in figure x of the paper"]
    used for tree inference:
        concatenated: ['yes' or 'no': was this concatenated alignment used to infer a tree in the study?]
        locus trees: ['yes' or 'no': were single-locus trees inferred from these loci in the study?]
    divergence time:
        source: ['datelife' for new datasets; 'timetree.org' only for datasets curated before November 2025; 'NA' if no estimate could be found]
        query taxa: [comma-separated list of the taxon names passed to DateLife, chosen to span the root of the ingroup, e.g. "Amborella trichopoda, Arabidopsis thaliana"; 'NA' if not applicable]
        date accessed: [date of the query as YYYY-MM-DD, or 'NA']
        median age: ['NA' or a number followed by 'mya', the median MRCA age across all chronograms returned by DateLife]
        min age: ['NA' or a number followed by 'mya', the youngest MRCA age across the chronograms returned]
        max age: ['NA' or a number followed by 'mya', the oldest MRCA age across the chronograms returned]
        N chronograms: ['NA' or an integer, the number of chronograms (source studies) that contained the MRCA]
        source studies: ['NA' or a comma-separated list of DOIs or citations of the chronograms used]
    study root age: ['NA' or a number followed by 'mya' (millions of years ago), if the estimated age of the root of the ingroup is reported in the study itself, put it here, with the figure or table it came from in notes]
    study clade:
        latin: [A single word in latin that describes the smallest clade of organisms that includes all those in the current study]
        english: [One or more words]
        taxon ID: [a GenBank Taxon ID, which should be an integer that resolves without a 404 when you add it to the end of this URL: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?mode=Info&id=, e.g. https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?mode=Info&id=27563]
    outgroups: [the outgroup taxa names exactly as they appear in alignment.nex, separated by commas; must match the TAXSET outgroups in alignment.nex]
    notes: ['NA', or some text. Anything important not covered by the sections above, that a user should know about]
